<li class="queue-row" data-etapa="{{ etapa }}" data-search="{{ busqueda }}">
  <div><strong>{{ project }}</strong>{% if is_new %} <span class='badge'>Nuevo</span>{% endif %}
    <div class="meta">{% if client_name %}{{ client_name }} · {% endif %}{% if code %}{{ code }} · {% endif %}{{ reason }}{% if mismos %} · +{{ mismos }} correo(s) más del mismo proyecto{% endif %}</div></div>
  <a class="button{% if not primaria %} secondary{% endif %}" href="{{ href }}">{{ verb }}</a>
</li>
