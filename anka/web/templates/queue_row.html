<li class="queue-row" data-etapa="{{ etapa }}">
  <span class="rank" aria-hidden="true">{{ position }}</span>
  <div><strong>{{ project }}</strong>{% if is_new %} <span class='badge'>Nuevo</span>{% endif %}
    <div class="meta">{{ client_name }}{% if code %} · {{ code }}{% endif %} · {{ reason }}{% if mismos %} · +{{ mismos }} hilo(s) más del mismo proyecto{% endif %}</div></div>
  <a class="button{% if not primaria %} secondary{% endif %}" href="{{ href }}">{{ verb }}</a>
</li>
