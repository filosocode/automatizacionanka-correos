<li class="queue-row">
  <span class="rank" aria-hidden="true">{{ position }}</span>
  <div><strong>{{ project }}</strong>{% if is_new %} <span class='badge'>Nuevo</span>{% endif %}
    <div class="meta">{{ client_name }}{% if code %} · {{ code }}{% endif %} · {{ reason }}</div></div>
  <a class="button{% if position != 1 %} secondary{% endif %}" href="{{ href }}">{{ verb }}</a>
</li>
