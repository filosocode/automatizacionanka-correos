<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - Anka</title>
  <script>try { var tema = localStorage.getItem('anka-tema'); if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema; } catch (e) { /* sin almacenamiento: sigue el sistema */ }</script>
  <style>
{% include "style.css" %}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark">A</span><div><strong>Anka</strong><span>Inteligencia comercial</span></div></div>
    <nav><a href="/">Resumen{% if unread_count %}<span class='nav-count'>{{ unread_count }}</span>{% endif %}</a><a href="/requests">Solicitudes</a><a href="/discarded">Descartadas</a><a href="/archive">Archivo</a></nav>
    <div class="toolbar">
      <button type="button" id="theme-toggle" class="secondary theme-toggle" aria-label="Cambiar el tema de color">Tema: sistema</button>
      <span id="bridge-chip" class="bridge-chip" hidden></span>
      <span id="google-chip" class="bridge-chip" hidden></span>
      <form method="post" action="/google/reautorizar" id="google-reauth" hidden>
        <button type="submit" class="secondary" data-confirm="Se abrirá la ventana de Google en este equipo para iniciar sesión y aceptar los permisos. ¿Continuar?">Reautorizar Google</button>
      </form>
      <details class="settings"><summary>Ajustes</summary><div class="settings-box">{{ mode_selector }}
        <div class="google-settings">
          <strong>Cuenta de Google</strong>
          <span id="google-status" class="meta">Verificando…</span>
          <form method="post" action="/google/reautorizar">
            <button type="submit" class="secondary" data-confirm="Se abrirá la ventana de Google en este equipo para iniciar sesión y aceptar los permisos. ¿Continuar?">Reautorizar Google</button>
          </form>
        </div>
      </div></details>
      {% if not is_work %}<form method="post" action="/refresh">
        <button type="submit">Actualizar correo</button>
      </form>{% endif %}
    </div>
  </header>
  <div id="fresh-banner" class="notice" hidden>Hay cambios nuevos. <a href="#" id="fresh-reload">Recargar</a></div>
  <main>{% if message %}<div class='notice'>{{ message }}</div>{% endif %}{{ body }}</main>
  <script>
    // Evita el doble envío: tras el primer clic en «Enviar ahora» el botón queda bloqueado.
    document.addEventListener('submit', event => {
      const sender = event.submitter;
      if (sender && sender.getAttribute('formaction') === '/send') {
        setTimeout(() => { sender.disabled = true; sender.textContent = 'Enviando…'; }, 0);
      }
    });
    window.addEventListener('pageshow', event => {
      if (event.persisted) location.reload();
    });
    document.addEventListener('click', event => {
      if (event.target.closest('[data-print]')) window.print();
      const button = event.target.closest('[data-confirm]');
      if (button && !confirm(button.dataset.confirm)) event.preventDefault();
    });
    (function () {
      // Tema: sistema → claro → oscuro; se recuerda en este navegador.
      const nombres = {system: 'sistema', light: 'claro', dark: 'oscuro'};
      const orden = ['system', 'light', 'dark'];
      const boton = document.getElementById('theme-toggle');
      let actual = 'system';
      try { actual = localStorage.getItem('anka-tema') || 'system'; } catch (e) { /* sin almacenamiento */ }
      if (!nombres[actual]) actual = 'system';
      function aplicar() {
        if (actual === 'system') delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = actual;
        boton.textContent = 'Tema: ' + nombres[actual];
      }
      boton.addEventListener('click', () => {
        actual = orden[(orden.indexOf(actual) + 1) % orden.length];
        try { if (actual === 'system') localStorage.removeItem('anka-tema'); else localStorage.setItem('anka-tema', actual); } catch (e) { /* sin almacenamiento */ }
        aplicar();
      });
      aplicar();
    })();
    (function () {
      let base = null, dirty = false;
      const chip = document.getElementById('bridge-chip');
      const googleChip = document.getElementById('google-chip');
      const googleForm = document.getElementById('google-reauth');
      const googleStatus = document.getElementById('google-status');
      document.addEventListener('input', () => { dirty = true; });
      document.getElementById('fresh-reload').addEventListener('click', e => { e.preventDefault(); location.reload(); });
      async function poll() {
        try {
          const r = await fetch('/state', {cache: 'no-store'});
          if (!r.ok) return;
          const s = await r.json();
          if (s.bridge) {
            chip.hidden = false;
            chip.dataset.state = s.bridge;
            chip.title = s.text;
            chip.textContent = {ok: 'Puente activo', error: 'Puente con avisos',
                                stopped: 'Puente detenido', never: 'Puente sin iniciar'}[s.bridge];
          } else { chip.hidden = true; }
          const g = s.google || {};
          const needsGoogle = g.estado === 'vencida' || g.estado === 'fallida';
          googleForm.hidden = !needsGoogle;
          googleChip.hidden = !(needsGoogle || g.estado === 'en_curso');
          googleChip.dataset.state = needsGoogle ? 'stopped' : 'error';
          googleChip.title = g.texto || '';
          if (g.texto) googleStatus.textContent = g.texto;
          googleChip.textContent = needsGoogle ? 'Google desconectado' : 'Autorizando Google…';
          if (base === null) base = s.v;
          else if (s.v !== base) {
            if (dirty || document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
              document.getElementById('fresh-banner').hidden = false;
            } else location.reload();
          }
        } catch (e) { /* servidor local cerrado: se reintenta */ }
      }
      poll();
      setInterval(poll, 20000);
    })();
  </script>
</body>
</html>
