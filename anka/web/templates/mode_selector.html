<form method="post" action="/mode" class="mode-form"><label for="mode">Motor</label><select id="mode" name="mode">{% if current not in labels %}<option value='' selected disabled>Sin configurar</option>{% endif %}{% for value, label in labels.items() %}<option value='{{ value }}'{% if value == current %} selected{% endif %}>{{ label }}</option>{% endfor %}</select><button type="submit" class="secondary">Cambiar</button></form>
