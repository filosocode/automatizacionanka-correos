<article class="case case-row" data-search="{{ search }}"
         data-status="{{ status }}" data-etapa="{{ etapa }}" data-fecha="{{ fecha }}" data-urgencia="{{ urgencia }}" data-type="{{ client_type }}"{% if selectable %} data-selectable{% endif %}>
  {% if selectable %}<input class="row-check" type="checkbox" name="thread_id" value="{{ thread_id }}" form="bulk-delete"{% if protegido %} data-protegido{% endif %} aria-label="Marcar {{ project }}">{% endif %}
  <div><h2><span class="verbo" aria-hidden="true">{{ verb }} · </span>{% if client_name %}{{ client_name }} · {% endif %}{{ project }}{% if is_new %} <span class='badge'>Nuevo</span>{% endif %}{% if reply_pending %} <span class='badge warn'>Respondió</span>{% endif %}</h2><div class="meta">{{ code }}</div></div>
  <div><strong>{{ services }}</strong><div class="meta">{{ sector }}</div></div>
  <span class="badge {{ badge_class }}">{{ status_label }}</span>
  <div class="meta">{{ date }}</div>
  <a class="button secondary" href="{{ href }}">{{ verb }}</a>
</article>
