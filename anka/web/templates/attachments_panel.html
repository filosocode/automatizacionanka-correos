<p class="resumen-tabla"><strong>{{ resumen }}</strong></p>
{% if filas %}<div class="scroll-x"><table class="act-resumen"><thead><tr><th scope="col">Archivo</th><th scope="col">Qué pasó</th></tr></thead>
<tbody>{% for fila in filas %}<tr class="fila-resumen{% if fila.atencion %} falta{% endif %}"><td>{{ fila.nombre }}</td><td><span class="chip {{ 'pendiente' if fila.atencion else 'confirmado' }}">{{ fila.etiqueta }}</span>{% if fila.motivo %}<span class="motivo">{{ fila.motivo | truncate(160) }}</span>{% endif %}</td></tr>
{% endfor %}</tbody></table></div>
<details class="more archivos-detalle"><summary>Ver más detalles de los archivos</summary>{{ detalle }}</details>{% endif %}
