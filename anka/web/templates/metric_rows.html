{% if not rows %}<p class='meta'>Aún no hay datos suficientes.</p>{% else %}<div class='metric-list'>{% for label, count, width in rows %}<div class='metric-row'><div class='metric-label' title='{{ label }}'>{{ label }}</div><div class='metric-track'><div class='metric-fill {{ color }}' style='width:{{ width }}%'></div></div><div class='metric-count'>{{ count }}</div></div>{% endfor %}</div>{% endif %}
