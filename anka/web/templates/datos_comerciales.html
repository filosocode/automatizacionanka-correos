<form method="post" action="/metadata" data-datos-comerciales>
  <input type="hidden" name="thread_id" value="{{ thread_id }}">
  <div class="filters">
    <label>Cliente o empresa<input name="client_name" data-nombre="Cliente o empresa" value="{{ review.client_name_saved | default('') }}" placeholder="{{ review.client_name }}"></label>
    <label>Tipo de cliente<select name="client_type">{% for value in client_types %}<option value='{{ value }}'{% if value == review.client_type %} selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
    <label>Sector<select name="sector">{% for value in sectors %}<option value='{{ value }}'{% if value == review.sector %} selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
  </div>
  <label>Notas comerciales<textarea name="notes" class="caja-media" data-nombre="Notas comerciales">{{ review.notes }}</textarea></label>
  <div class="toolbar spaced"><button type="submit">Guardar datos comerciales</button></div>
</form>
