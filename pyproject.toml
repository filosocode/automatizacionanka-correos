[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# Deuda conocida: líneas largas heredadas; se corrigen al dividir app.py.
ignore = ["E501"]

[tool.coverage.run]
source = ["anka", "app.py", "supervisor.py", "work_dashboard_sync.py", "check_spec.py"]
omit = ["simulaciones/*", "tests/*", ".venv/*", ".uv-cache/*", ".github/*"]

[tool.coverage.report]
# Piso de cobertura: sube cuando mejore, nunca lo bajes para hacer pasar un cambio.
fail_under = 82
skip_covered = false

[tool.mypy]
python_version = "3.11"
files = ["."]
exclude = ['^simulaciones/', '^\.venv/', '^\.uv-cache/', '^tests/', '^archivo_local/']
# Las librerías de Google no publican tipos completos.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
