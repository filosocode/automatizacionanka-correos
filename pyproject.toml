[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# Deuda conocida: líneas largas heredadas; se corrigen al dividir app.py.
ignore = ["E501"]

[tool.coverage.run]
source = ["."]
omit = ["test_*.py", "_isolate.py", ".venv/*", ".uv-cache/*", ".github/*"]

[tool.coverage.report]
# Piso de cobertura: sube cuando mejore, nunca lo bajes para hacer pasar un cambio.
fail_under = 82
skip_covered = false
