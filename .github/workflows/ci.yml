name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"      # cada lunes: la auditoría de dependencias avisa de vulnerabilidades nuevas aunque nadie suba código

# Una corrida nueva de la misma rama cancela la anterior que ya no sirve (U-65).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: python -m ruff check .
      - name: Tipos
        run: python -m mypy
      - name: Especificación trazada
        run: python check_spec.py
      - name: Tests con cobertura
        run: |
          python -m coverage run -m unittest discover -s tests -t .
          python -m coverage report

  # Vulnerabilidades conocidas en las dependencias fijadas (U-61, B2-15). Es un paso de CI: no se instala nada en el
  # equipo de quien desarrolla (ver «Auditar dependencias» en docs/ESTANDAR_CAMBIOS.md).
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: python -m pip install pip-audit==2.9.0
      # Cada archivo por separado: ambos fijan los mismos paquetes (p. ej. shapely) y pip-audit rechaza un mismo
      # paquete repetido en una sola pasada. --require-hashes ya implica no resolver dependencias.
      - name: Auditar dependencias de ejecución
        run: python -m pip_audit --require-hashes --disable-pip -r requirements.lock
      - name: Auditar dependencias de desarrollo
        run: python -m pip_audit --require-hashes --disable-pip -r requirements-dev.lock
